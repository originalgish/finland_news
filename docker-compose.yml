# Container logs rotate at 10 MB, keeping three files per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ft
      POSTGRES_DB: ft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ft"]
      interval: 10s
    restart: unless-stopped
    logging: *logging

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    env_file: .env
    environment:
      TZ: Europe/Helsinki
    depends_on: { db: { condition: service_healthy } }
    command: ["supercronic", "/app/worker/crontab"]
    restart: unless-stopped
    logging: *logging

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    command: ["gunicorn", "-w", "2", "-b", "0.0.0.0:8000", "web:create_app()"]
    restart: unless-stopped
    logging: *logging

  # Only started with COMPOSE_PROFILES=prod (set on the server, not locally).
  caddy:
    image: caddy:2
    profiles: [prod]
    ports: ["80:80", "443:443"]
    # Defaults are blank so that `make up` works without these set. Caddy refuses to start
    # with a blank value, which is the check that matters on the server.
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy_data:
