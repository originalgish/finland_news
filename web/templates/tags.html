{% extends "base.html" %}
{% block title %}Tags · Finland News{% endblock %}
{% block content %}
<h1>Tags</h1>
<form class="tag-form" hx-post="/tags" hx-target="#tag-rows" hx-swap="beforeend">
  <input name="name" placeholder="New tag name" aria-label="New tag name" required>
  <label>Weight <input name="weight" type="number" step="0.1" value="1.0"></label>
  <label class="check"><input type="checkbox" name="llm_assignable" checked> Offered to the LLM</label>
  <button type="submit">Add tag</button>
</form>
<div class="table-wrap">
<table class="tags">
  <thead><tr><th>Tag</th><th>Articles</th><th>Weight and LLM</th><th>Keyword rules</th><th></th></tr></thead>
  <tbody id="tag-rows">
    {% for row in tags %}{% with tag=row.tag, rules=row.rules %}{% include "partials/tag_row.html" %}{% endwith %}{% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
