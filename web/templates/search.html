{% extends "base.html" %}
{% block title %}Search · Finland News{% endblock %}
{% block search %}
<form class="search" action="/search" method="get" role="search">
  <input type="search" name="q" value="{{ query }}" placeholder="Search Finnish or English" aria-label="Search"
         hx-get="/search" hx-trigger="input changed delay:300ms" hx-target="#results" hx-push-url="true">
</form>
{% endblock %}
{% block content %}
<section id="results">{% include "partials/search_results.html" %}</section>
{% endblock %}
